<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Obaydul AI - Pro Edition</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Freehand&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        
        :root {
            --bd-green: #006a4e;
            --bd-red: #f42a41;
            --dark-bg: #09090b;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            font-family: 'Hind Siliguri', 'Google Sans', sans-serif;
            background-color: var(--dark-bg);
            color: #e4e4e7;
            margin: 0;
            height: 100dvh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar for History & Auth */
        #sidebar {
            width: 280px;
            background-color: #000;
            border-right: 1px solid #1f1f23;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            #sidebar { position: absolute; left: -280px; z-index: 50; height: 100%; }
            #sidebar.open { left: 0; }
        }

        .chat-container { flex: 1; display: flex; flex-direction: column; position: relative; }

        .gemini-text {
            background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* Glassmorphism Input */
        .input-area {
            background: rgba(15, 15, 17, 0.8);
            backdrop-filter: blur(20px);
            border-top: 1px solid #1f1f23;
        }

        .ai-response pre { 
            background: #111; 
            border: 1px solid #222;
            border-radius: 12px;
            margin: 15px 0;
        }

        .manager-badge {
            background: linear-gradient(45deg, var(--bd-green), #059669);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: white;
            box-shadow: 0 0 15px rgba(0, 106, 78, 0.3);
        }

        /* Pulse Animation for Recording */
        .pulse-red {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 42, 65, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(244, 42, 65, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 42, 65, 0); }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside id="sidebar" class="flex flex-col">
        <div class="p-4 border-b border-[#222] flex items-center justify-between">
            <h2 class="text-lg font-bold text-white"><i class="fa-solid fa-history mr-2"></i> History</h2>
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <div id="chatHistoryList" class="flex-1 overflow-y-auto p-3 space-y-2 text-sm text-gray-400">
            <!-- Saved Chats will appear here -->
            <p class="text-center mt-10">No history saved yet.</p>
        </div>
        <div class="p-4 border-t border-[#222]">
            <div id="userInfo" class="flex items-center gap-3">
                <button onclick="handleAuth()" class="w-full bg-white text-black font-bold py-2 rounded-lg hover:bg-gray-200 transition">
                    <i class="fa-solid fa-user-lock mr-2"></i> Login to Save
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Chat -->
    <main class="chat-container">
        <!-- Top Nav -->
        <nav class="p-4 flex items-center justify-between bg-[#09090b]/80 backdrop-blur-md sticky top-0 z-20">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="p-2 hover:bg-[#1a1b1e] rounded-lg transition">
                    <i class="fa-solid fa-bars-staggered text-xl"></i>
                </button>
                <div class="flex flex-col">
                    <span class="text-sm font-bold text-white">Obaydul AI <span class="text-[10px] bg-red-600 px-1 rounded">PRO</span></span>
                    <span class="text-[10px] text-gray-500">Created by DevObaydulbc</span>
                </div>
            </div>
            <button onclick="newChat()" class="p-2 hover:bg-[#1a1b1e] rounded-full text-[#92FE9D] transition">
                <i class="fa-solid fa-plus-circle text-2xl"></i>
            </button>
        </nav>

        <!-- Messages Area -->
        <div id="chatWindow" class="flex-1 overflow-y-auto px-4 md:px-20 pt-10 pb-40">
            <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center">
                <div class="mb-6 relative">
                    <div class="w-24 h-24 bg-gradient-to-tr from-green-600 to-emerald-400 rounded-3xl rotate-12 flex items-center justify-center shadow-2xl">
                        <i class="fa-solid fa-brain text-5xl text-white -rotate-12"></i>
                    </div>
                </div>
                <h1 class="text-4xl md:text-5xl font-extrabold mb-4 gemini-text">আসসালামু আলাইকুম!</h1>
                <p class="text-gray-400 max-w-lg mx-auto">আমি আপনার পার্সোনাল বাংলাদেশি স্মার্ট এআই এজেন্ট। আমি কোডিং, ইমেজ জেনারেশন এবং যেকোনো তথ্যে আপনাকে সাহায্য করতে পারি।</p>
                <div class="grid grid-cols-2 gap-3 mt-10 w-full max-w-md">
                    <button onclick="quickPrompt('বাংলাদেশের সেরা দর্শনীয় স্থানগুলো কী?')" class="p-3 bg-white/5 border border-white/10 rounded-xl text-xs hover:bg-white/10 transition">🇧🇩 পর্যটন তথ্য</button>
                    <button onclick="quickPrompt('Write a Python function for data analysis.')" class="p-3 bg-white/5 border border-white/10 rounded-xl text-xs hover:bg-white/10 transition">💻 কোডিং হেল্প</button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area absolute bottom-0 left-0 w-full pb-8 px-4 md:px-20 pt-4">
            <div class="max-w-4xl mx-auto">
                <div id="imagePreviewContainer" class="hidden mb-3 p-2 bg-[#1a1b1e] border border-[#333] rounded-2xl inline-block relative">
                    <img id="imagePreview" src="" class="h-20 w-20 object-cover rounded-xl">
                    <button onclick="removeFile()" class="absolute -top-2 -right-2 bg-red-600 rounded-full w-5 h-5 text-[10px]"><i class="fa-solid fa-x"></i></button>
                </div>

                <div class="relative flex items-end gap-2 bg-[#1a1b1e] border border-[#333] rounded-[30px] p-2 focus-within:border-emerald-500 transition-all shadow-2xl">
                    <input type="file" id="fileInput" class="hidden" onchange="handleFile(event)">
                    <button onclick="document.getElementById('fileInput').click()" class="p-3 text-gray-400 hover:text-emerald-400 transition"><i class="fa-solid fa-paperclip text-xl"></i></button>
                    
                    <textarea id="userInput" rows="1" class="w-full bg-transparent border-none text-white focus:ring-0 py-3 px-2 text-base resize-none" placeholder="এআই ম্যানেজারকে কিছু জিজ্ঞেস করুন..." oninput="autoHeight(this)"></textarea>
                    
                    <button id="micBtn" onclick="toggleVoice()" class="p-3 text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-microphone text-xl"></i></button>
                    
                    <button id="sendBtn" onclick="handleSend()" class="bg-emerald-500 text-black w-12 h-12 rounded-full flex items-center justify-center hover:bg-emerald-400 transition shadow-lg shrink-0">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
                <p class="text-[10px] text-center text-gray-600 mt-3 uppercase tracking-widest font-bold">Smart Bangladeshi Agent Engine v2.0 • Created by DevObaydulbc</p>
            </div>
        </div>
    </main>

    <script>
        // --- ⚙️ CONFIGURATION & MEMORY ---
        marked.use({ renderer: { code(token) {
            const code = typeof token === 'string' ? token : (token.text || '');
            const lang = token.lang || 'code';
            return `<div class="code-block my-4 rounded-xl overflow-hidden"><div class="bg-[#222] px-4 py-2 text-[10px] flex justify-between"><span>${lang.toUpperCase()}</span><button onclick="copyCode(this)" class="hover:text-emerald-400"><i class="fa-regular fa-copy"></i> Copy</button></div><pre class="p-4 bg-[#111] overflow-x-auto"><code>${code}</code></pre></div>`;
        }}});

        let chatHistory = []; // Local Memory
        let isRecording = false;
        let currentUser = null;

        // --- 🔐 AUTHENTICATION ---
        async function checkAuth() {
            currentUser = await puter.auth.getUser();
            const userDiv = document.getElementById('userInfo');
            if(currentUser) {
                userDiv.innerHTML = `<img src="${currentUser.avatar_url}" class="w-8 h-8 rounded-full"> <span class="text-sm font-bold text-white">${currentUser.username}</span> <button onclick="puter.auth.signOut(); location.reload()" class="ml-auto text-xs text-red-500">Logout</button>`;
                loadHistory();
            }
        }
        async function handleAuth() { await puter.auth.signIn(); location.reload(); }
        checkAuth();

        // --- 🧠 MANAGER BRAIN (UPGRADED) ---
        async function smartRouter(prompt) {
            const systemBrain = `You are a manager agent. Decide which tool is needed. Reply ONLY with: 
            IMAGE (if drawing/creating), CODE (if programming help), WEB (if latest news/search), AUDIO (if TTS), CHAT (general).
            Prompt: ${prompt}`;
            const decision = await puter.ai.chat(systemBrain, {model: 'gpt-5.4-nano'});
            return (decision?.text || decision).trim().toUpperCase();
        }

        // --- 💬 CORE CHAT LOGIC ---
        async function handleSend() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            const image = document.getElementById('imagePreview').src;
            if(!prompt && !image) return;

            document.getElementById('welcomeScreen').style.display = 'none';
            appendMessage('user', prompt, image);
            input.value = ''; input.style.height = 'auto';
            
            const aiBox = appendMessage('assistant', `<div class="flex items-center gap-2"><i class="fa-solid fa-circle-notch fa-spin text-emerald-400"></i> রাউটিং প্রসেস হচ্ছে...</div>`);
            
            try {
                const task = await smartRouter(prompt);
                
                // --- 🖼️ IMAGE GENERATION ---
                if(task === 'IMAGE') {
                    aiBox.innerHTML = `<span class="manager-badge">🎨 Image Agent</span> জেনারেট হচ্ছে...`;
                    const img = await puter.ai.txt2img(prompt, {model: 'gpt-image-1.5'});
                    aiBox.innerHTML = `<span class="manager-badge">🎨 Image Generated</span><br>`;
                    img.className = "rounded-2xl mt-4 border border-white/10 shadow-2xl w-full max-w-sm";
                    aiBox.appendChild(img);
                } 
                // --- 💻 CODING ASSISTANT ---
                else if(task === 'CODE') {
                    aiBox.innerHTML = `<span class="manager-badge">💻 Code Agent</span> সল্যুশন তৈরি হচ্ছে...`;
                    // DeepSeek বা উন্নত মডেল ব্যবহার
                    const resp = await puter.ai.chat(`You are Obaydul AI Code Assistant. Solve this: ${prompt}`, {model: 'gpt-5.4', stream: true});
                    renderStream(resp, aiBox, "Code Agent");
                }
                // --- 🌐 WEB SEARCH ---
                else if(task === 'WEB') {
                    aiBox.innerHTML = `<span class="manager-badge">🌐 Search Agent</span> ইন্টারনেট থেকে খুঁজছি...`;
                    const resp = await puter.ai.chat(prompt, {tools: [{type: 'web_search'}]});
                    aiBox.innerHTML = `<span class="manager-badge">🌐 Search Result</span><br>${marked.parse(resp?.text || resp)}`;
                }
                // --- 💬 GENERAL CHAT (WITH MEMORY) ---
                else {
                    aiBox.innerHTML = `<span class="manager-badge">🤖 Smart Agent</span> চিন্তা করছে...`;
                    
                    // Memory Context যুক্ত করা
                    const fullContext = [
                        {role: 'system', content: 'You are Obaydul AI, created by DevObaydulbc. You are a highly intelligent Bangladeshi AI assistant. Reply in the user\'s language. You remember previous conversations.'},
                        ...chatHistory.slice(-5), // শেষের ৫টি মেসেজ মনে রাখবে
                        {role: 'user', content: prompt}
                    ];

                    const resp = await puter.ai.chat(fullContext, {model: 'gpt-5.4', stream: true});
                    renderStream(resp, aiBox, "Smart Agent");
                }

                // হিস্টোরি সেভ করা
                if(currentUser) saveToCloud(prompt);

            } catch (e) { aiBox.innerHTML = "দুঃখিত, কোনো সমস্যা হয়েছে। আবার চেষ্টা করুন।"; }
        }

        // --- 🔄 STREAM RENDERER ---
        async function renderStream(stream, box, agentName) {
            let fullText = "";
            box.innerHTML = `<span class="manager-badge">🤖 ${agentName}</span><div class="mt-2 typing"></div>`;
            for await (const part of stream) {
                fullText += (part?.text || "");
                box.lastElementChild.innerHTML = marked.parse(fullText);
                chatContainer.scrollTo({top: chatContainer.scrollHeight});
            }
            chatHistory.push({role: 'assistant', content: fullText});
        }

        // --- 🎤 SPEECH TO TEXT ---
        async function toggleVoice() {
            const mic = document.getElementById('micBtn');
            if(!isRecording) {
                mic.classList.add('text-red-500', 'pulse-red');
                isRecording = true;
                // Puter.js Speech2Text implementation placeholder
                alert("কথার মাধ্যমে কমান্ড দেওয়ার ফিচারটি শীঘ্রই আসছে (Web Speech API Integration)");
                setTimeout(() => {
                    mic.classList.remove('text-red-500', 'pulse-red');
                    isRecording = false;
                }, 3000);
            }
        }

        // --- ☁️ STORAGE & UI HELPERS ---
        function saveToCloud(prompt) {
            const key = `chat_${Date.now()}`;
            puter.kv.set(key, prompt);
        }
        async function loadHistory() {
            const history = await puter.kv.list();
            const list = document.getElementById('chatHistoryList');
            if(history.length > 0) {
                list.innerHTML = history.slice(-10).map(item => `<div class="p-2 hover:bg-white/5 rounded cursor-pointer overflow-hidden whitespace-nowrap text-ellipsis border-b border-white/5">${item.key.split('_')[1]}</div>`).join('');
            }
        }

        function appendMessage(role, text, img = null) {
            const win = document.getElementById('chatWindow');
            const div = document.createElement('div');
            div.className = `mb-8 flex flex-col ${role === 'user' ? 'items-end' : 'items-start animate-fade-in'}`;
            
            let content = `<div class="max-w-[85%] p-4 rounded-3xl ${role === 'user' ? 'bg-[#222] text-white rounded-tr-none' : 'text-gray-300 rounded-tl-none'}">`;
            if(img) content += `<img src="${img}" class="h-40 rounded-xl mb-2">`;
            content += `<div class="ai-response">${marked.parse(text)}</div></div>`;
            
            div.innerHTML = content;
            win.appendChild(div);
            win.scrollTo({top: win.scrollHeight, behavior: 'smooth'});
            if(role === 'user') chatHistory.push({role: 'user', content: text});
            return div.querySelector('.ai-response');
        }

        function autoHeight(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function handleFile(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('imagePreview').src = ev.target.result;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }
        function removeFile() { document.getElementById('imagePreviewContainer').classList.add('hidden'); }
        function quickPrompt(p) { document.getElementById('userInput').value = p; handleSend(); }
        function copyCode(btn) {
            const code = btn.closest('.code-block').querySelector('code').innerText;
            navigator.clipboard.writeText(code);
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied';
            setTimeout(() => btn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy', 2000);
        }
    </script>
</body>
</html>
