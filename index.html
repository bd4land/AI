<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Manager AI - Puter.js</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Google Sans', sans-serif;
            background-color: #0f0f11;
            color: #e3e3e3;
            margin: 0;
            height: 100dvh; 
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        ::-webkit-scrollbar { width: 6px; height: 4px;}
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444746; border-radius: 10px; }

        .magic-gradient {
            background: linear-gradient(90deg, #00C9FF 0%, #92FE9D 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        textarea { resize: none; overflow-y: hidden; }
        textarea:focus { outline: none; }

        .ai-response p { margin-bottom: 1rem; line-height: 1.6; }
        .ai-response h1, .ai-response h2, .ai-response h3 { color: #fff; font-weight: 500; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .ai-response ul, .ai-response ol { padding-left: 1.5rem; margin-bottom: 1rem; }
        .ai-response pre { background: #1e1e20; padding: 1rem; border-radius: 12px; overflow-x: auto; margin-bottom: 1rem; border: 1px solid #333; }
        .ai-response code { font-family: monospace; background: #282a2c; padding: 2px 6px; border-radius: 6px; color: #92FE9D; }
        .ai-response pre code { background: transparent; padding: 0; color: #e3e3e3; }

        .blinking-cursor::after { content: '▋'; animation: blink 1s infinite; margin-left: 5px; color: #92FE9D; }
        @keyframes blink { 50% { opacity: 0; } }

        .shimmer {
            background: #282a2c;
            background-image: linear-gradient(to right, #282a2c 0%, #3a3d40 20%, #282a2c 40%, #282a2c 100%);
            background-repeat: no-repeat; background-size: 800px 100%; 
            animation: placeholderShimmer 1.5s linear infinite forwards;
        }
        @keyframes placeholderShimmer { 0% { background-position: -468px 0; } 100% { background-position: 468px 0; } }

        /* Manager Badge */
        .manager-badge {
            display: inline-block;
            background: rgba(146, 254, 157, 0.1);
            color: #92FE9D;
            border: 1px solid rgba(146, 254, 157, 0.3);
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="flex-none flex items-center justify-between p-4 bg-[#0f0f11] text-white border-b border-[#222]">
        <div class="text-lg md:text-xl font-medium tracking-wide flex items-center gap-2">
            <i class="fa-solid fa-robot text-[#92FE9D]"></i> Auto Agent AI
        </div>
        <button onclick="location.reload()" class="bg-[#1a1b1e] hover:bg-[#2c2d30] px-4 py-2 rounded-full text-sm font-medium transition flex items-center border border-[#333]">
            <i class="fa-solid fa-rotate-right mr-2"></i> Reset
        </button>
    </header>

    <!-- Main Chat Area -->
    <main id="chatContainer" class="flex-1 overflow-y-auto px-4 sm:px-6 md:px-8 w-full max-w-4xl mx-auto pt-6">
        <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center">
            <div class="w-20 h-20 bg-[#1a1b1e] rounded-full flex items-center justify-center mb-6 border border-[#333] shadow-[0_0_30px_rgba(146,254,157,0.15)]">
                <i class="fa-solid fa-wand-magic-sparkles text-4xl text-[#92FE9D]"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold mb-4 magic-gradient pb-2">I am your AI Manager</h1>
            <p class="text-gray-400 text-base md:text-lg mb-8 max-w-md">Tell me what you need. I will automatically route your request to the best AI model.</p>
        </div>
    </main>

    <!-- Bottom Input Area -->
    <footer class="flex-none w-full bg-[#0f0f11] pt-2 pb-6 px-4 sm:px-6 md:px-8 bg-opacity-95 backdrop-blur-md">
        <div class="max-w-3xl mx-auto">
            
            <div class="relative flex flex-col bg-[#1a1b1e] border border-[#333] rounded-3xl focus-within:border-[#92FE9D] transition-colors p-1 md:p-2 shadow-lg">
                
                <!-- Image Preview Section -->
                <div id="imagePreviewContainer" class="hidden px-4 pt-3 pb-1 relative inline-block">
                    <div class="relative w-16 h-16 md:w-20 md:h-20 group">
                        <img id="imagePreview" src="" alt="Attached" class="w-full h-full object-cover rounded-xl border border-[#444746]">
                        <button onclick="removeAttachment()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-end w-full">
                    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFileUpload(event)">
                    
                    <button onclick="document.getElementById('fileInput').click()" class="mb-1 ml-1 md:ml-2 w-10 h-10 shrink-0 rounded-full flex items-center justify-center text-gray-400 hover:bg-[#2c2d30] hover:text-[#92FE9D] transition">
                        <i class="fa-solid fa-paperclip text-xl"></i>
                    </button>

                    <textarea id="promptInput" rows="1" class="w-full bg-transparent border-none text-white focus:ring-0 resize-none px-2 py-3 md:px-3 text-sm md:text-base leading-relaxed" placeholder="Message your Manager AI (Auto Mode)..." oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                    
                    <button id="sendBtn" onclick="processRequest()" class="mb-1 mr-1 md:mr-2 w-10 h-10 shrink-0 rounded-full flex items-center justify-center text-gray-800 bg-[#92FE9D] hover:bg-[#6ee680] transition disabled:opacity-50 disabled:bg-gray-700">
                        <i class="fa-solid fa-arrow-up text-lg font-bold"></i>
                    </button>
                </div>
            </div>
            
            <div class="text-center text-xs text-gray-500 mt-3 flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt text-[#00C9FF]"></i> Smart Auto-Routing Enabled
            </div>
        </div>
    </footer>

    <script>
        marked.setOptions({ breaks: true, gfm: true });

        const chatContainer = document.getElementById('chatContainer');
        const promptInput = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        
        let isGenerating = false;
        let currentAttachedImageBase64 = null;

        // Paste Image Logic
        promptInput.addEventListener('paste', function (e) {
            if (e.clipboardData.files && e.clipboardData.files.length > 0) {
                const file = e.clipboardData.files[0];
                if (file.type.startsWith('image/')) {
                    e.preventDefault();
                    processFile(file);
                }
            }
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) processFile(file);
            event.target.value = '';
        }

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                currentAttachedImageBase64 = e.target.result;
                imagePreview.src = currentAttachedImageBase64;
                imagePreviewContainer.classList.remove('hidden');
                promptInput.placeholder = "Manager knows this is an image. Ask something about it...";
                promptInput.focus();
            };
            reader.readAsDataURL(file);
        }

        function removeAttachment() {
            currentAttachedImageBase64 = null;
            imagePreview.src = '';
            imagePreviewContainer.classList.add('hidden');
            promptInput.placeholder = "Message your Manager AI (Auto Mode)...";
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 150 ? textarea.scrollHeight : 150) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
                e.preventDefault();
                processRequest();
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function createChatBubble(isUser, text = '') {
            const wrapper = document.createElement('div');
            wrapper.className = "w-full mb-6 flex gap-3 md:gap-4";
            
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center shrink-0 text-white text-sm font-bold mt-1 shadow-md ${isUser ? 'bg-[#333] border border-[#555]' : 'bg-[#92FE9D] text-[#0f0f11]'}`;
            avatar.innerHTML = isUser ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            const contentBox = document.createElement('div');
            contentBox.className = "flex-1 ai-response min-w-0 flex flex-col justify-center text-sm md:text-base";
            
            if(isUser) {
                if(currentAttachedImageBase64) {
                    const imgPreview = document.createElement('img');
                    imgPreview.src = currentAttachedImageBase64;
                    imgPreview.className = "max-w-[150px] md:max-w-[200px] rounded-xl mb-2 md:mb-3 border border-[#333] object-cover";
                    contentBox.appendChild(imgPreview);
                }
                const textSpan = document.createElement('div');
                textSpan.innerText = text;
                contentBox.appendChild(textSpan);
            }

            wrapper.appendChild(avatar);
            wrapper.appendChild(contentBox);
            chatContainer.appendChild(wrapper);
            return contentBox;
        }

        // ==========================================
        //  AI MANAGER LOGIC (THE BRAIN)
        // ==========================================
        async function determineTaskType(prompt) {
            // Fast Prompt Classification via GPT-5.3-Chat (Fastest model)
            const systemPrompt = `You are an AI Manager router. Analyze the user's prompt and categorize it into exactly ONE of these words: 
            IMAGE (if they want to generate, create, draw, or paint a picture/image), 
            SEARCH (if they explicitly ask to search the web, want latest news, current time/weather, or real-time info), 
            AUDIO (if they ask to convert text to speech, speak, or create audio), 
            CHAT (for general questions, coding, writing, or anything else).
            
            Reply with ONLY the exact category word. No other text.
            User Prompt: "${prompt}"`;

            try {
                // We use low temperature for deterministic routing
                const rawResponse = await puter.ai.chat(systemPrompt, { model: 'gpt-5.3-chat', temperature: 0 });
                const decision = (typeof rawResponse === 'string' ? rawResponse : rawResponse?.text || "").trim().toUpperCase();
                
                if (['IMAGE', 'SEARCH', 'AUDIO'].includes(decision)) return decision;
                return 'CHAT'; // default fallback
            } catch (error) {
                console.error("Manager classification failed, defaulting to CHAT", error);
                return 'CHAT';
            }
        }

        async function processRequest() {
            const prompt = promptInput.value.trim();
            if (!prompt && !currentAttachedImageBase64 || isGenerating) return;
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            // 1. User Message
            createChatBubble(true, prompt || "Analyze this image.");
            const imageToSend = currentAttachedImageBase64;
            removeAttachment(); 
            promptInput.value = '';
            promptInput.style.height = 'auto';
            scrollToBottom();

            // 2. AI UI Creation
            const aiContentBox = createChatBubble(false);
            isGenerating = true;
            sendBtn.disabled = true;

            try {
                // 3. IF IMAGE ATTACHED -> AUTO VISION MODE
                if (imageToSend) {
                    aiContentBox.innerHTML = `
                        <div class="manager-badge"><i class="fa-solid fa-eye mr-1"></i> Manager selected: Vision Analysis</div>
                        <div class="flex items-center gap-3 text-[#92FE9D] text-sm"><i class="fa-solid fa-scan fa-pulse"></i><span>Analyzing pixels...</span></div>
                    `;
                    
                    const response = await puter.ai.chat(prompt || "Analyze this image in detail.", imageToSend, { model: "gpt-5.4-nano" });
                    aiContentBox.innerHTML = `<div class="manager-badge"><i class="fa-solid fa-eye mr-1"></i> Vision Complete</div><div class="mt-1">${marked.parse(response?.text || response?.message?.content || response)}</div>`;
                } 
                
                // 4. NO IMAGE ATTACHED -> ASK THE MANAGER TO CLASSIFY THE PROMPT
                else {
                    aiContentBox.innerHTML = `
                        <div class="flex items-center gap-3 text-gray-400 text-sm">
                            <i class="fa-solid fa-microchip fa-fade text-[#00C9FF]"></i>
                            <span>Manager is analyzing intent...</span>
                        </div>
                    `;

                    // Ask Manager AI to decide
                    const taskType = await determineTaskType(prompt);

                    // ==============================
                    // ROUTE TO CORRECT MODEL
                    // ==============================
                    if (taskType === 'IMAGE') {
                        aiContentBox.innerHTML = `
                            <div class="manager-badge"><i class="fa-solid fa-palette mr-1"></i> Manager selected: Image Generation</div>
                            <div class="w-full max-w-sm h-48 md:h-64 shimmer rounded-xl border border-[#333] mt-2"></div>
                        `;
                        const imgElement = await puter.ai.txt2img(prompt, { model: "gpt-image-1.5" });
                        aiContentBox.innerHTML = `<div class="manager-badge"><i class="fa-solid fa-palette mr-1"></i> Image Created</div><br>`;
                        imgElement.className = "w-full max-w-sm md:max-w-lg rounded-xl border border-[#333] shadow-lg mt-1";
                        aiContentBox.appendChild(imgElement);
                    }
                    else if (taskType === 'SEARCH') {
                        aiContentBox.innerHTML = `
                            <div class="manager-badge"><i class="fa-solid fa-globe mr-1"></i> Manager selected: Web Search</div>
                            <div class="flex items-center gap-3 text-[#00C9FF] text-sm mt-2"><i class="fa-solid fa-satellite-dish fa-spin"></i><span>Browsing the internet...</span></div>
                        `;
                        const response = await puter.ai.chat(prompt, { model: "openai/gpt-5.2-chat", tools:[{ type: "web_search" }] });
                        const responseText = (typeof response === 'string') ? response : (response?.text || response?.message?.content || JSON.stringify(response));
                        aiContentBox.innerHTML = `<div class="manager-badge"><i class="fa-solid fa-globe mr-1"></i> Web Search Results</div><div class="mt-1">${marked.parse(responseText)}</div>`;
                    }
                    else if (taskType === 'AUDIO') {
                        aiContentBox.innerHTML = `
                            <div class="manager-badge"><i class="fa-solid fa-music mr-1"></i> Manager selected: Text-to-Speech</div>
                            <div class="flex items-center gap-3 text-[#92FE9D] text-sm mt-2"><i class="fa-solid fa-compact-disc fa-spin"></i><span>Synthesizing voice...</span></div>
                        `;
                        const audioElement = await puter.ai.txt2speech(prompt, { provider: "openai" });
                        aiContentBox.innerHTML = `<div class="manager-badge"><i class="fa-solid fa-music mr-1"></i> Audio Generated</div><br>`;
                        audioElement.setAttribute("controls", "");
                        audioElement.className = "w-full max-w-[260px] md:max-w-md rounded-full shadow-lg outline-none bg-[#1a1b1e] h-10 md:h-12 border border-[#333] mt-1";
                        aiContentBox.appendChild(audioElement);
                    }
                    else {
                        // Default Chat
                        aiContentBox.innerHTML = `<div class="manager-badge"><i class="fa-solid fa-message mr-1"></i> Manager selected: Smart Chat</div><div class="mt-1 blinking-cursor"></div>`;
                        
                        const response = await puter.ai.chat(prompt, { model: "gpt-5.4", stream: true });
                        let fullText = "";
                        const badgeHTML = `<div class="manager-badge"><i class="fa-solid fa-message mr-1"></i> Manager selected: Smart Chat</div><div class="mt-1">`;
                        
                        for await (const part of response) {
                            fullText += (part?.text || part?.message?.content || "");
                            aiContentBox.innerHTML = badgeHTML + marked.parse(fullText) + "</div>";
                            scrollToBottom();
                        }
                    }
                }
            } catch (error) {
                aiContentBox.innerHTML = `<span class="text-red-400 text-sm md:text-base"><i class="fa-solid fa-triangle-exclamation mr-2"></i> Error: ${error.message}</span>`;
            } finally {
                aiContentBox.classList.remove('blinking-cursor');
                isGenerating = false;
                sendBtn.disabled = false;
                scrollToBottom();
            }
        }
    </script>
</body>
</html>
